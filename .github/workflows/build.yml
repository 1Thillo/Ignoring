name: Build

on:
  push:
    branches: ['26.2', '1.21.11', '1.21.8', '1.21.4', '1.20.4', '1.20.2']
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Report the built version
        run: |
          echo "Built artifacts:"
          ls -l build/libs

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

  client-smoke-test:
    name: Client smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install a headless OpenGL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libxi6 libxcursor1 libxrandr2 libxinerama1 libxxf86vm1

      # A green `./gradlew build` proves very little for a Fabric mod: mixin
      # targets are only resolved when the game loads the class they patch, so
      # a wrong target name compiles fine and explodes at runtime. Booting the
      # client is what actually exercises them.
      - name: Boot the client and watch for mixin failures
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -uo pipefail
          mkdir -p run/logs
          : > run/logs/latest.log
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./gradlew runClient --stacktrace > client-output.log 2>&1 &
          gradle_pid=$!

          # The runner has no audio device, so the client logs "Failed to open
          # OpenAL device" and never reaches "Sound engine started". Key on the
          # block atlas instead: by the time it exists the client has a working
          # GL context and has finished its startup resource reload.
          started=0
          for _ in $(seq 1 180); do
            if grep -qE 'minecraft:textures/atlas/blocks\.png-atlas|Sound engine started' run/logs/latest.log 2>/dev/null; then
              started=1
              break
            fi
            if ! kill -0 "$gradle_pid" 2>/dev/null; then
              break
            fi
            sleep 5
          done

          # let the tail of the reload settle so late class loads still show up
          if [ "$started" -eq 1 ]; then
            sleep 30
          fi

          kill "$gradle_pid" 2>/dev/null || true
          pkill -f 'net.fabricmc.devlaunchinjector.Main' 2>/dev/null || true
          sleep 5

          echo "===== last 100 lines of the client log ====="
          tail -n 100 run/logs/latest.log || true

          if [ "$started" -ne 1 ]; then
            echo "::error::The client never finished starting up."
            echo "===== gradle output ====="
            tail -n 200 client-output.log || true
            exit 1
          fi

          if grep -qE 'Minecraft has crashed|Exception in thread "main"' run/logs/latest.log; then
            echo "::error::The client crashed during startup."
            exit 1
          fi

          if grep -qE 'Mixin apply .* failed|InvalidInjectionException|InjectionError|MixinApplyError|MixinTransformerError' run/logs/latest.log; then
            echo "::error::A mixin failed to apply."
            grep -nE 'Mixin apply .* failed|InvalidInjectionException|InjectionError|MixinApplyError|MixinTransformerError' run/logs/latest.log
            exit 1
          fi

          if ! grep -q -- '- ignoring ' run/logs/latest.log; then
            echo "::error::The loader did not list the mod as loaded."
            exit 1
          fi

          echo "The client finished starting up with every mixin applied."

      - name: Upload the client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-log
          path: |
            run/logs/latest.log
            client-output.log
          if-no-files-found: ignore

  publish:
    name: Attach the jar to the release
    if: github.event_name == 'release'
    needs: [build, client-smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Download the mod jar
        uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: build/libs

      - name: Attach the jar to the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
