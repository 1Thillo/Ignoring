plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

def targetJavaVersion = 25

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Compiled against, never shipped: the voice chat integration only runs when
    // the mod is actually installed.
    compileOnly "maven.modrinth:simple-voice-chat:${project.voicechat_version}"

    compileOnly "org.projectlombok:lombok:1.18.48"
    annotationProcessor "org.projectlombok:lombok:1.18.48"
}

processResources {
    inputs.properties([
        "version": project.version,
        "minecraft_version": project.minecraft_version,
        "loader_version": project.loader_version
    ])
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand([
            "version": project.version,
            "minecraft_version": project.minecraft_version,
            "loader_version": project.loader_version
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    if (JavaVersion.current() < JavaVersion.toVersion(targetJavaVersion)) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }

    archiveFileName = "${project.base.archivesName.get()}-${project.minecraft_version}+${version}.${archiveExtension.get()}"
}
